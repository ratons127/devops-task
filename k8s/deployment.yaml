apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-app
  namespace: devops-task
  labels:
    app.kubernetes.io/name: devops-task-app
  annotations:
    kubernetes.io/change-cause: "initial deploy 1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired replica count; add one new pod at a time.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-task-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: devops-task-app
      containers:
        - name: app
          image: devops-task-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: devops-task-app-config
          # APP_VERSION is baked into the image at build time, so it always matches the tag.
          env:
            # Sensitive value from a Secret created out-of-band (never committed). See README.
            - name: APP_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-task-app-secrets
                  key: APP_SECRET_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Give the Service/Ingress time to remove this pod from endpoints
            # before SIGTERM is delivered -> no dropped requests during rollouts.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

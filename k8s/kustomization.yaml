apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-task
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
# The Secret is intentionally NOT listed here: it is created out-of-band
# (kubectl create secret ...) so no secret value ever lands in git. See README.

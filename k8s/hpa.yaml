apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-task-app
  namespace: devops-task
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # % of the CPU *request*
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping after a short burst

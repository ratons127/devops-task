name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Never run two releases at once, and never cancel one half-way through a deploy.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build multi-arch & push to ECR
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS role, and keyless cosign signing
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version and tags
        id: version
        run: |
          # Semantic version: MAJOR.MINOR from the VERSION file, PATCH = workflow run number.
          # Monotonic, unique, and compatible with ECR immutable tags.
          version="$(tr -d '[:space:]' < VERSION).${GITHUB_RUN_NUMBER}"
          {
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo="${REGISTRY}/${REPOSITORY}"
          {
            echo "repo=${repo}"
            echo "version=${VERSION}"
            echo "image=${repo}:${VERSION}"
            echo "tags<<EOF"
            echo "${repo}:${VERSION}"
            echo "${repo}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, Sigstore)
        env:
          IMAGE: ${{ steps.meta.outputs.repo }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Summary
        run: |
          {
            echo "## Published image"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.version }}\`, \`sha-${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    needs: build-push
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      image: ${{ needs.build-push.outputs.image }}
      version: ${{ needs.build-push.outputs.version }}

  deploy-production:
    name: Deploy to production
    needs: [build-push, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      image: ${{ needs.build-push.outputs.image }}
      version: ${{ needs.build-push.outputs.version }}
